name: Teer Live Results Poller

on:
  schedule:
    # 03:30 UTC = 9:00 AM IST: Morning rollover & archive yesterday
    - cron: '30 3 * * 1-6'
    # 08:00 UTC to 12:45 UTC = 1:30 PM to 6:15 PM IST (Mon-Sat Day Draws: Juwai, Shillong, Khanapara every 5 mins)
    - cron: '*/5 8-12 * * 1-6'
    # 16:30 UTC to 18:45 UTC = 10:00 PM to 12:15 AM IST (Night Teer Mon-Sat every 5 mins)
    - cron: '*/5 16-18 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Teer Poller & Telegram Broadcaster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '@teerresultlive_in' }}
        run: npm run poll

      - name: Commit & Push If Changed
        run: |
          git config --global user.name "Teer Result Bot"
          git config --global user.email "support@teerresultlive.in"
          if [ -n "$(git status --porcelain src/data/)" ]; then
            git add src/data/
            git commit -m "Auto-update Teer live numbers"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No data changes detected."
          fi
